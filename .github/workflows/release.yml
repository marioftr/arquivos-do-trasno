name: Publicar versión

# Cando subes unha etiqueta v*, constrúese o instalador asinado e publícase en GitHub Releases
# xunto co ficheiro latest.json que le a actualización automática da app.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p trasno-engine
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Arquivos do Trasno ${{ github.ref_name }}'
          releaseBody: 'Novidades: abre a app e mira Novidades → Rexistro de cambios.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
