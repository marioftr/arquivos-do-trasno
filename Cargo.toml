[workspace]
resolver = "2"
members = [
    "crates/trasno-engine",
    "src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["marioftr"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
