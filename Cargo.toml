[workspace]
resolver = "2"
members = [
    "crates/trasno-engine",
    "src-tauri",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"
authors = ["marioftr"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
# Só táboas de liñas (backtraces con ficheiro:liña): os .pdb enteiros chegaban a 280 MB cada un.
debug = "line-tables-only"

# As dependencias non se depuran: sen información de depuración propia.
[profile.dev.package."*"]
debug = false
